<!doctype html>
<html lang="es-ES"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viagens — Gestión de flota</title>
<style>
:root{--navy:#122c40;--green:#176b50;--mint:#eaf5ef;--orange:#f17c25;--paper:#f5f7f9;--line:#dfe7eb;--muted:#647786}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--navy);background:var(--paper)}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.brand{background:white;text-align:center;padding:22px;border-bottom:1px solid var(--line)}.brand img{width:210px;max-height:100px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;color:#95500b;background:#fff1df;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em}.wrap{max-width:1120px;margin:auto;padding:32px 24px 60px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.toolbar a{color:var(--green);text-decoration:none;font-weight:600}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:750}h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.04em;margin:5px 0 8px}h2{font-size:19px;margin:0 0 16px}p{color:var(--muted)}.intro{text-align:center;margin:24px 0 32px}.intro p{margin:6px auto;max-width:620px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 5px 20px #122c4005}.access{text-align:left;position:relative;padding:32px;width:100%;color:inherit;transition:transform .2s,border-color .2s}.access:hover{transform:translateY(-3px);border-color:var(--green)}.access .icon{font-size:28px;background:var(--mint);width:58px;height:58px;border-radius:16px;display:grid;place-items:center;margin-bottom:24px}.access strong{font-size:23px;display:block}.access p{min-height:48px}.access span.link{color:var(--green);font-weight:700}.notice{font-size:12px;color:var(--muted);margin:22px 0}.btn{border:1px solid var(--line);background:white;border-radius:10px;color:var(--navy);padding:11px 17px;font-weight:650}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.orange{background:var(--orange);border-color:var(--orange);color:#1b2632}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:30px;margin:8px 0}.stat .change{font-size:12px;color:var(--green)}.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input,select{padding:11px 12px;border:1px solid #becbd3;border-radius:9px;background:white;min-width:0;width:100%;color:var(--navy)}input:focus,select:focus{outline:2px solid #176b5040;border-color:var(--green)}.period input{width:auto}label{font-size:13px;font-weight:650;display:grid;gap:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field-group{border:0;padding:0;margin:24px 0}legend{font-size:17px;font-weight:700;margin-bottom:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}th,td{padding:13px 10px;border-bottom:1px solid var(--line)}.chart{width:100%;height:auto;max-height:260px}.chart text{font:12px system-ui;fill:var(--muted)}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px}.dot.orange{background:var(--orange)}.country{display:flex;align-items:center;gap:8px}.country .flag{font-size:24px}.empty{padding:25px;color:var(--muted);text-align:center}.report{margin-top:24px}.signature{margin-top:26px;padding:20px;border:1px dashed #9cafa5;border-radius:12px}.signed{font-family:Georgia,serif;font-style:italic;font-size:24px;color:var(--green)}.error{color:#b53324;font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;border-top:1px solid var(--line)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:13px 22px;border-radius:12px;max-width:90%;z-index:9}#toast:empty{display:none}[hidden]{display:none!important}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.wrap{padding:24px 16px}.toolbar{align-items:flex-start;flex-direction:column}.card{padding:20px}.access p{min-height:0}}@media print{body{background:white}.brand,.toolbar,.intro,.no-print,footer,#toast{display:none!important}.wrap{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}.report{margin:0}th,td{white-space:normal}.signature{break-inside:avoid}.print-title{display:block!important} @page{size:A4;margin:16mm}}
</style></head><body><header class="brand"><img src="../assets/Logo_Viagens.png" alt="Viajes"><small>Gestión de viajes y gastos de flota</small><nav class="no-print" aria-label="Idioma" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:13px"><a href="index.html" lang="pt" style="color:var(--green)">Português</a><a href="index.en.html" lang="en" style="color:var(--green)">English</a><a href="index.es.html" lang="es" style="color:var(--green)">Español</a></nav><div class="no-print" style="margin-top:12px;font-size:12px"><a href="pdf/Prototipo_Gestor_ES.pdf">PDF Gestor</a> · <a href="pdf/Prototipo_Condutor_ES.pdf">PDF Conductor</a></div></header><main class="wrap" id="app"></main><footer>Viagens · Prototipo de experiencia · Datos ficticios · Sin autenticación ni base de datos</footer><div id="toast" role="status" aria-live="polite"></div>
<script>
const app=document.getElementById('app');
const drivers=[{id:'joao',name:'João Silva',truck:'34-AB-56'},{id:'ana',name:'Ana Martins',truck:'78-CD-90'},{id:'pedro',name:'Pedro Lopes',truck:'12-EF-34'}];
const countries={PT:'🇵🇹 Portugal',ES:'🇪🇸 España',FR:'🇫🇷 Francia'};
const currentMonth=new Date().toISOString().slice(0,7);const prevDate=new Date();prevDate.setMonth(prevDate.getMonth()-1);const previousMonth=prevDate.toISOString().slice(0,7);
let trips=[{driver:'joao',start:currentMonth+'-03T08:00',end:currentMonth+'-03T17:00',origin:'Tui',from:'ES',destination:'Madrid',to:'ES',initial:82410,final:82999},{driver:'joao',start:currentMonth+'-08T07:30',end:currentMonth+'-08T16:00',origin:'Madrid',from:'ES',destination:'Porto',to:'PT',initial:82999,final:83500},{driver:'ana',start:currentMonth+'-05T09:00',end:currentMonth+'-05T13:00',origin:'Vigo',from:'ES',destination:'Porto',to:'PT',initial:41000,final:41172},{driver:'pedro',start:currentMonth+'-10T08:00',end:currentMonth+'-10T13:00',origin:'Lisboa',from:'PT',destination:'Faro',to:'PT',initial:62000,final:62278},{driver:'joao',start:previousMonth+'-03T08:00',end:previousMonth+'-03T16:00',origin:'Tui',from:'ES',destination:'Madrid',to:'ES',initial:81000,final:81580},{driver:'ana',start:previousMonth+'-05T08:00',end:previousMonth+'-05T13:00',origin:'Vigo',from:'ES',destination:'Porto',to:'PT',initial:40000,final:40170}];
const consumptions=[
{driver:'joao',date:currentMonth+'-03',type:'Combustible',place:'Tui',country:'ES',litres:180,amount:279},
{driver:'joao',date:currentMonth+'-08',type:'Combustible',place:'Madrid',country:'ES',litres:150,amount:240},
{driver:'joao',date:currentMonth+'-08',type:'Aparcamiento',place:'Porto',country:'PT',litres:0,amount:24},
{driver:'ana',date:currentMonth+'-05',type:'Combustible',place:'Vigo',country:'ES',litres:52,amount:80.60},
{driver:'ana',date:currentMonth+'-05',type:'Aparcamiento',place:'Porto',country:'PT',litres:0,amount:12},
{driver:'pedro',date:currentMonth+'-10',type:'Combustible',place:'Lisboa',country:'PT',litres:83,amount:132.80},
{driver:'joao',date:previousMonth+'-03',type:'Combustible',place:'Tui',country:'ES',litres:175,amount:271.25},
{driver:'ana',date:previousMonth+'-05',type:'Combustible',place:'Vigo',country:'ES',litres:50,amount:77.50}
];
let role='',driverId='joao',month=currentMonth,signature=null;
const selectedConsumptions=(m=month,id=null)=>consumptions.filter(c=>c.date.slice(0,7)===m&&(!id||c.driver===id));
const money=n=>n.toLocaleString('es-ES',{style:'currency',currency:'EUR'});
const sumField=(a,key)=>a.reduce((n,c)=>n+c[key],0);
function consumptionRows(a){return a.map(c=>{const person=drivers.find(x=>x.id===c.driver);return `<tr><td>${new Date(c.date+'T12:00').toLocaleDateString('es-ES')}</td><td>${esc(person.name)}<br>${person.truck}</td><td>${c.type}</td><td>${esc(c.place)} ${countries[c.country].split(' ')[0]}</td><td>${c.type==='Combustible'?num(c.litres)+' L':'—'}</td><td>${money(c.amount)}</td></tr>`}).join('')}
function consumptionTable(a){return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Conductor / camión</th><th>Tipo</th><th>Lugar / país</th><th>Cantidad</th><th>Importe</th></tr></thead><tbody>${consumptionRows(a)}</tbody></table></div>${!a.length?'<p class="empty">No hay consumos para este período.</p>':''}<p><strong>Combustible: ${num(sumField(a,'litres'))} L · Total: ${money(sumField(a,'amount'))}</strong></p>`}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n.toLocaleString('es-ES');const km=t=>t.final-t.initial;
const selected=(m=month,id=null)=>trips.filter(t=>t.start.slice(0,7)===m&&(!id||t.driver===id));
const total=a=>a.reduce((v,t)=>v+km(t),0);
const d=()=>drivers.find(x=>x.id===driverId);
function previous(m){let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-2,1)).toISOString().slice(0,7)}
function percent(now,before){return before?((now-before)/before*100).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})+'%': 'Sin base anterior'}
function labelMonth(m){return new Date(m+'-02T12:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function date(s){return new Date(s).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}
function toast(s){document.getElementById('toast').textContent=s;setTimeout(()=>document.getElementById('toast').textContent='',3800)}
function pageHeader(title,sub){return `<div class="toolbar no-print"><a href="#" data-go="home">← Elegir acceso</a><span class="badge">DEMOSTRACIÓN · ${role==='manager'?'GESTOR':esc(d().name)}</span></div><div class="no-print"><div class="eyebrow">${role==='manager'?'Visión de la flota':'Área individual del conductor'}</div><h1>${title}</h1><p>${sub}</p></div>`}
function options(){return Object.entries(countries).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}
function home(){role='';app.innerHTML=`<div class="intro"><span class="badge">PROTOTIPO NAVEGABLE</span><h1>Cada viaje, una visión más clara.</h1><p>Elija su acceso para supervisar la flota o gestionar sus registros de viaje.</p></div><div class="grid"><button class="card access" data-access="manager"><span class="icon" aria-hidden="true">▥</span><strong>Acceso Gestor</strong><p>Indicadores mensuales, camiones, kilómetros, consumos y conductores.</p><span class="link">Supervisar la flota →</span></button><button class="card access" data-access="driver"><span class="icon" aria-hidden="true">↗</span><strong>Acceso individual del conductor</strong><p>Sus rutas, viajes e informes en un solo lugar.</p><span class="link">Abrir área individual →</span></button></div><p class="notice" style="text-align:center">Los accesos simulan perfiles. Este prototipo no valida el inicio de sesión.</p>`;bind()}
function chart(id){const now=selected(month,id),old=selected(previous(month),id);const values=id?[total(old),total(now)]:drivers.flatMap(x=>[total(old.filter(t=>t.driver===x.id)),total(now.filter(t=>t.driver===x.id))]);const max=Math.max(...values,1);let bars='';if(id){[total(old),total(now)].forEach((v,i)=>{let h=v/max*150;bars+=`<rect x="${150+i*230}" y="${185-h}" width="100" height="${h}" rx="5" fill="${i?'#176b50':'#f17c25'}"/><text x="${200+i*230}" y="${175-h}" text-anchor="middle">${num(v)} km</text><text x="${200+i*230}" y="213" text-anchor="middle">${i?'Mes seleccionado':'Mes anterior'}</text>`})}else{drivers.forEach((x,i)=>{[total(old.filter(t=>t.driver===x.id)),total(now.filter(t=>t.driver===x.id))].forEach((v,j)=>{let h=v/max*145;bars+=`<rect x="${72+i*215+j*57}" y="${185-h}" width="45" height="${h}" rx="4" fill="${j?'#176b50':'#f17c25'}"/><text x="${94+i*215+j*57}" y="${175-h}" text-anchor="middle">${num(v)}</text>`});bars+=`<text x="${123+i*215}" y="215" text-anchor="middle">${x.name}</text>`})}return `<svg class="chart" viewBox="0 0 700 235" role="img" aria-label="Comparación de kilómetros con el mes anterior"><line x1="35" y1="186" x2="675" y2="186" stroke="#dfe7eb"/>${bars}</svg><div class="legend"><span><i class="dot orange"></i>Mes anterior</span><span><i class="dot"></i>Mes seleccionado</span></div>`}
function dashboard(){let id=role==='driver'?driverId:null,a=selected(month,id),b=selected(previous(month),id),active=new Set(a.map(t=>t.driver)).size;app.innerHTML=pageHeader(role==='manager'?'Su flota, en perspectiva.':'Hola, '+esc(d().name)+'.',role==='manager'?'Supervise la actividad mensual y la evolución respecto al mes anterior.':'Consulte su rendimiento y mantenga sus viajes actualizados.')+`<div class="period no-print"><label for="month">Período mensual</label><input type="month" id="month" value="${month}" required><button class="btn" id="updateMonth">Actualizar</button>${role==='driver'?`<label for="driverSelect">Conductor de demostración</label><select id="driverSelect" style="width:auto">${drivers.map(x=>`<option value="${x.id}" ${x.id===driverId?'selected':''}>${x.name}</option>`).join('')}</select>`:''}</div><div class="stats"><div class="card stat"><small>${id?'Camión asignado':'Total de camiones de la flota'}</small><strong>${id?d().truck:drivers.length}</strong><span class="change">${id?'Vehículo de demostración':active+' con viajes en el mes · '+percent(active,new Set(b.map(t=>t.driver)).size)+' de variación de actividad'}</span></div><div class="card stat"><small>Kilómetros del mes</small><strong>${num(total(a))} <small style="display:inline;font-size:15px">km</small></strong><span class="change">${percent(total(a),total(b))} respecto al mes anterior</span></div><div class="card stat"><small>Viajes registrados</small><strong>${a.length}</strong><span class="change">${labelMonth(month)}</span></div></div><section class="card"><h2>${id?'Su gráfico personal':'Kilómetros por conductor y camión'}</h2>${chart(id)}<p class="notice">Variación porcentual = (mes seleccionado − mes anterior) ÷ mes anterior × 100. La actividad cuenta camiones con viajes registrados.</p></section><div class="actions no-print">${role==='manager'?'<button class="btn primary" data-go="consumption">Consumos</button>':'<button class="btn primary" data-go="new">＋ Añadir viaje</button><button class="btn" data-go="consumption">Consumos</button>'}<button class="btn" data-go="query">⌕ Consultar</button></div>${role==='manager'?`<section class="card"><h2>Lista de conductores</h2><div class="table-wrap"><table><thead><tr><th>Conductor</th><th>Camión</th><th>Viajes</th><th>Km del período</th></tr></thead><tbody>${drivers.map(x=>`<tr><td>${x.name}</td><td>${x.truck}</td><td>${selected(month,x.id).length}</td><td>${num(total(selected(month,x.id)))}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;bind();document.getElementById('updateMonth').onclick=()=>{let v=document.getElementById('month').value;if(v){month=v;signature=null;dashboard()}};if(id)document.getElementById('driverSelect').onchange=e=>{driverId=e.target.value;signature=null;dashboard()}}
function newTrip(){app.innerHTML=pageHeader('Añadir viaje','Registre la salida y la llegada. Todos los campos son obligatorios.')+`<button class="btn no-print" data-go="dashboard">← Volver al panel</button><form class="card" id="tripForm" style="margin-top:22px"><p><strong>${esc(d().name)}</strong> · Camión ${d().truck}</p><fieldset class="field-group"><legend>01 · Salida</legend><div class="fields"><label>Fecha y hora de inicio<input type="datetime-local" name="start" required></label><label>Lugar de salida<input name="origin" placeholder="Ej.: Tui" maxlength="100" required></label><label>País de salida<div class="country"><span class="flag" id="flagFrom" aria-hidden="true">🇵🇹</span><select name="from" id="from">${options()}</select></div></label><label>Kilómetros iniciales<input name="initial" type="number" min="0" step="1" required></label></div></fieldset><fieldset class="field-group"><legend>02 · Llegada</legend><div class="fields"><label>Fecha y hora final<input type="datetime-local" name="end" required></label><label>Lugar de llegada<input name="destination" placeholder="Ej.: Madrid" maxlength="100" required></label><label>País de llegada<div class="country"><span class="flag" id="flagTo" aria-hidden="true">🇵🇹</span><select name="to" id="to">${options()}</select></div></label><label>Kilómetros finales<input name="final" type="number" min="0" step="1" required></label></div></fieldset><p id="formError" class="error" role="alert"></p><button class="btn primary" type="submit">Registrar viaje</button><p class="notice">El registro se conserva solo en esta sesión de demostración y no se envía a un servidor.</p></form>`;bind();['from','to'].forEach(n=>document.getElementById(n).onchange=e=>document.getElementById(n==='from'?'flagFrom':'flagTo').textContent=countries[e.target.value].split(' ')[0]);document.getElementById('tripForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.initial=Number(data.initial);data.final=Number(data.final);let msg='';if(!data.origin.trim()||!data.destination.trim())msg='Introduzca los lugares de salida y llegada.';else if(data.end<data.start)msg='La llegada no puede ser anterior a la salida.';else if(data.final<data.initial)msg='Los kilómetros finales no pueden ser inferiores a los iniciales.';if(msg){document.getElementById('formError').textContent=msg;return}trips.push({...data,origin:data.origin.trim(),destination:data.destination.trim(),driver:driverId});month=data.start.slice(0,7);signature=null;dashboard();toast('Viaje registrado en esta sesión de demostración.')}}
function consumption(){
const id=role==='driver'?driverId:null,a=selectedConsumptions(month,id),old=selectedConsumptions(previous(month),id);
app.innerHTML=pageHeader(role==='driver'?'Sus consumos':'Consumos de la flota','Consulte el combustible y los aparcamientos del período mensual.')+`<button class="btn no-print" data-go="dashboard">← Volver al panel</button><section class="card no-print" style="margin-top:22px"><form id="consumptionPeriod" class="period"><label>Mes y año<input type="month" id="consumptionMonth" value="${month}" required></label><button class="btn" type="submit">Actualizar</button></form></section><div class="stats"><div class="card stat"><small>Gasto total</small><strong>${money(sumField(a,'amount'))}</strong><span class="change">${percent(sumField(a,'amount'),sumField(old,'amount'))} respecto al mes anterior</span></div><div class="card stat"><small>Combustible</small><strong>${num(sumField(a,'litres'))} L</strong><span class="change">${money(sumField(a.filter(c=>c.type==='Combustible'),'amount'))}</span></div><div class="card stat"><small>Aparcamientos</small><strong>${money(sumField(a.filter(c=>c.type==='Aparcamiento'),'amount'))}</strong><span class="change">${a.filter(c=>c.type==='Aparcamiento').length} registro(s)</span></div></div><section class="card"><h2>${labelMonth(month)}${id?' · '+esc(d().name):' · Todos los conductores'}</h2>${consumptionTable(a)}<p class="notice">Datos ficticios. Los consumos son registros de demostración independientes de los viajes añadidos en esta sesión.</p></section><div class="actions no-print"><button class="btn primary" data-go="queryConsumption">Consultar / generar informe de consumos</button><button class="btn" data-go="queryCombined">Informe conjunto con viajes</button></div>`;
bind();document.getElementById('consumptionPeriod').onsubmit=e=>{e.preventDefault();month=document.getElementById('consumptionMonth').value;consumption()};
}
function query(initialType='trips'){
signature=null;
app.innerHTML=pageHeader('Consultar viajes y consumos','Elija el período y el contenido del informe, separado o conjunto.')+`<button class="btn no-print" data-go="dashboard">← Volver al panel</button><section class="card no-print" style="margin-top:22px"><form id="searchForm" class="period"><span aria-hidden="true" style="font-size:30px">⌕</span><label for="searchMonth">Mes y año<input id="searchMonth" type="month" value="${month}" required></label><label for="reportType">Contenido del informe<select id="reportType"><option value="trips">Viajes</option><option value="consumptions">Consumos</option><option value="combined">Viajes y consumos</option></select></label>${role==='manager'?`<label>Conductor<select id="queryDriver"><option value="">Todos los conductores</option>${drivers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label>`:''}<button type="submit" class="btn primary">Consultar</button></form></section><div id="report"></div>`;
document.getElementById('reportType').value=initialType;bind();document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();month=document.getElementById('searchMonth').value;signature=null;report()};report();
}
function report(){
const id=role==='driver'?driverId:document.getElementById('queryDriver').value,type=document.getElementById('reportType').value;
const a=selected(month,id),c=selectedConsumptions(month,id),name=id?drivers.find(x=>x.id===id).name:'Todos los conductores';
const includeTrips=type!=='consumptions',includeConsumptions=type!=='trips',hasFecha=(includeTrips&&a.length)||(includeConsumptions&&c.length);
const title={trips:'Informe mensual de viajes',consumptions:'Informe mensual de consumos',combined:'Informe mensual de viajes y consumos'}[type];
const tripSection=includeTrips?`<section style="margin-top:26px"><h2>Viajes</h2><p>${a.length} viaje(s) · <strong>${num(total(a))} km</strong></p><div class="table-wrap"><table><thead><tr><th>Conductor / camión</th><th>Salida</th><th>Llegada</th><th>Km iniciales</th><th>Km finales</th><th>Distancia</th></tr></thead><tbody>${a.map(t=>`<tr><td>${esc(drivers.find(x=>x.id===t.driver).name)}<br>${drivers.find(x=>x.id===t.driver).truck}</td><td>${esc(t.origin)} ${countries[t.from].split(' ')[0]}<br>${date(t.start)}</td><td>${esc(t.destination)} ${countries[t.to].split(' ')[0]}<br>${date(t.end)}</td><td>${num(t.initial)}</td><td>${num(t.final)}</td><td>${num(km(t))} km</td></tr>`).join('')}</tbody></table></div>${!a.length?'<p class="empty">No hay viajes para este período.</p>':''}</section>`:'';
const consumptionSection=includeConsumptions?`<section style="margin-top:26px"><h2>Consumos — combustible y aparcamientos</h2>${consumptionTable(c)}</section>`:'';
document.getElementById('report').innerHTML=`<section class="card report"><div class="eyebrow">Folha de Viagem · ${title}</div><h1>${labelMonth(month)}</h1><p>${esc(name)}</p>${tripSection}${consumptionSection}<div class="signature"><h2>Firma del informe</h2><div id="signatureView"><p>Sin firma.</p></div><div class="no-print"><p class="notice">Simulación de firma digital: solo nombre y fecha, sin certificado criptográfico ni validez de firma cualificada.</p><form id="signatureForm"><label>Nombre del firmante<input id="signer" maxlength="100" value="${role==='driver'?esc(d().name):''}" required placeholder="Nombre completo"></label><label style="display:flex;align-items:center;margin:12px 0"><input id="agree" type="checkbox" required style="width:auto">Confirmo que he revisado los datos de este informe de demostración.</label><button class="btn" type="submit" ${!hasFecha?'disabled':''}>Firmar informe — simulación</button></form></div></div><p class="notice">Documento de demostración · Datos ficticios · Firma simulada, sin certificación digital.</p></section><div class="actions no-print"><button class="btn primary" id="pdf" ${!hasFecha?'disabled':''}>Generar informe en PDF</button><p class="notice">En la ventana de impresión, elija «Guardar como PDF». El documento incluye únicamente los resultados mostrados arriba.</p></div>`;
document.getElementById('signatureForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('signer').value.trim();if(!name)return;signature={name,time:new Date().toLocaleString('es-ES')};document.getElementById('signatureView').innerHTML=`<div class="signed">${esc(name)}</div><p>Firmado el ${signature.time} · SIMULACIÓN</p>`;toast('Firma simulada añadida al informe.')};
document.getElementById('pdf').onclick=()=>{document.title='Viajes - '+title+' - '+month;window.print()};
}
function bind(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();({home,dashboard,new:newTrip,query:()=>query(),consumption,queryConsumption:()=>query('consumptions'),queryCombined:()=>query('combined')})[b.dataset.go]();window.scrollTo(0,0)});app.querySelectorAll('[data-access]').forEach(b=>b.onclick=()=>{role=b.dataset.access;dashboard();window.scrollTo(0,0)})}
home();
</script></body></html>
