<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Log · Prototype 1.8</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#14263a;background:#edf2f5;--green:#146348;--ink:#14263a;--muted:#516577;--line:#d5e0e6}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
.shell{width:min(100% - 24px,650px);margin:auto}header{background:#fff;border-bottom:1px solid var(--line)}.bar{min-height:75px;display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{width:142px;height:auto;display:block}.small{font-size:.82rem;padding:.45rem .7rem;min-height:38px}
main{padding:24px 0}.card{padding:clamp(18px,5vw,36px);background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px #283e4a0b}.hero{background:#e8f4ee;padding:23px;border-radius:17px;margin-bottom:20px}.hero p,.muted{color:var(--muted)}h1,h2,h3,p{margin:0 0 .65rem}h1{font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.13;letter-spacing:-.04em}h2{font-size:1.3rem}h3{font-size:1rem}
button{border:1px solid var(--green);border-radius:12px;background:var(--green);color:white;min-height:47px;padding:.65rem 1rem;font-weight:650}button:hover:not(:disabled){filter:brightness(.93)}.secondary{background:white;color:var(--green)}.wide{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:.65rem;flex-wrap:wrap;margin-top:1rem}.actions button{flex:1}.stack{display:grid;gap:12px}.section{border:1px solid var(--line);border-radius:15px;padding:15px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}
label{font-weight:620;display:block}input,select,textarea{width:100%;min-height:47px;border:1px solid #aebfc9;border-radius:10px;background:white;color:var(--ink);padding:.55rem .65rem;margin-top:.25rem}textarea{min-height:120px;resize:vertical}[aria-invalid=true]{border:2px solid #a12727}:focus-visible{outline:3px solid #c76b14;outline-offset:3px}.upper{text-transform:uppercase}
.notice{background:#e9f5ee;padding:.75rem;border-radius:10px;margin-bottom:1rem}.notice:empty{display:none}.error{color:#8f2020;font-weight:610;margin-top:.6rem}.error:empty{display:none}.hint,footer{font-size:.88rem;color:var(--muted)}.hint{margin:.5rem 0}.totals{background:#e8f4ee;padding:12px;border-radius:10px;margin-top:14px;font-weight:650}.trip{display:flex;gap:10px;justify-content:space-between;align-items:start}.trip p:last-child{margin-bottom:0}footer{padding:0 0 24px;text-align:center}.report{display:none}
@media(max-width:425px){.grid{grid-template-columns:1fr}.trip{display:block}.trip button{margin-top:.7rem}.bar{min-height:65px}}
@media print{body{background:white;color:black}.shell{width:100%;margin:0}header,footer,.card,#status{display:none}.report{display:block}main{padding:0}.report table{width:100%;border-collapse:collapse;font-size:10pt}.report td,.report th{border:1px solid #aaa;text-align:left;padding:7px}.report tr{break-inside:avoid}@page{size:A4;margin:16mm}}

.language-switch{display:flex;justify-content:center;flex-wrap:wrap;gap:.45rem;margin-top:14px}
.language-switch a{display:inline-flex;align-items:center;justify-content:center;min-width:52px;min-height:44px;padding:.3rem .6rem;border:1px solid var(--line);border-radius:8px;background:white;color:var(--green)}
.language-switch .flag{width:30px;height:20px}
.language-switch a[aria-current=page]{background:var(--green);color:white;text-decoration:none}
@media print{.language-switch{display:none}}
</style>
<style>
.site-footer{border-top:1px solid var(--line);padding:16px 0 24px}
.site-footer p{margin:0 0 .35rem}
.footer-contacts{display:flex;justify-content:center;flex-wrap:wrap;gap:.25rem 1rem}
.footer-whatsapp{display:inline-flex;align-items:center;color:#146348}
.footer-whatsapp svg{width:21px;height:21px}
.country-mark{display:inline-flex;align-items:center;gap:.45em;white-space:nowrap;vertical-align:middle}
.flag{width:26px;height:18px;border:1px solid #14263a38;border-radius:3px;vertical-align:middle}
.country-picker{position:relative;min-width:0}
.country-picker summary{list-style:none;cursor:pointer;min-height:47px;margin-top:.25rem;padding:.55rem .65rem;border:1px solid #aebfc9;border-radius:10px;background:white;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.country-picker summary::-webkit-details-marker{display:none}
.country-list{display:grid;gap:4px;padding:5px;border:1px solid #aebfc9;border-radius:10px;background:white;max-height:235px;overflow:auto}
.country-list button{display:flex;align-items:center;gap:.6rem;min-height:42px;width:100%;text-align:left;background:white;color:var(--ink);border:0}
.country-list button:hover,.country-list button[aria-pressed=true]{background:#e8f4ee}
@media print{.flag{width:19px;height:13px;print-color-adjust:exact;-webkit-print-color-adjust:exact}}
@media print{.site-footer{display:block;margin-top:16px;padding:8px 0 0}.site-footer .demo-label{display:none}}
</style>
</head>

const tripDate=value=>value.slice(0,10);
const tripDateText=value=>new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"}).format(new Date(tripDate(value)+"T12:00:00Z"));
const num=value=>Number(value).toLocaleString("en-GB",{maximumFractionDigits:2});
const distance=trip=>trip.kmEnd-trip.kmStart;
const countryText=code=>'<span class="country-mark">'+(Object.hasOwn(flags,code)?'<svg class="flag" viewBox="0 0 36 24" preserveAspectRatio="none" aria-hidden="true">'+flags[code]+'</svg>':'')+'<span>'+safe(code)+'</span></span>';
function countryPicker(name,selected){
  return '<div><strong>Country</strong><details class="country-picker"><summary aria-label="Select country"><span class="country-current">'+
    (selected?countryText(selected):'Select country')+'</span><span aria-hidden="true">⌄</span></summary>'+
    '<div class="country-list">'+Object.entries(countries).map(([code,label])=>'<button type="button" data-country="'+code+'" aria-pressed="'+(code===selected)+'">'+countryText(code)+' '+label+'</button>').join("")+
    '</div><input type="hidden" name="'+name+'" value="'+safe(selected)+'"></details></div>';
}
const plateOptions=selected=>plates.map(plate=>'<option '+(selected===plate?'selected ':'')+'>'+plate+'</option>').join("");
const button=(text,action,style="secondary")=>'<button type="button" class="'+style+'" data-go="'+action+'">'+text+'</button>';
function updateHeader(){headerAction.textContent=user?"Sign out":"Private area";}
function go(page,notice=""){
  statusBox.textContent=notice;report.innerHTML="";
  if(page==="login")renderLogin();
  if(page==="home")renderHome();
  if(page==="trip")renderTrip();
  if(page==="search")renderSearch();
  if(page==="messages")renderMessages();
  if(page==="fuel")renderFuel();
  updateHeader();
  if(page!=="login"){view.querySelector("h1").tabIndex=-1;view.querySelector("h1").focus();}
}
function renderLogin(){
  view.innerHTML='<div class="hero"><h1>Trip Log</h1><p>Employee area</p></div><button id="expand" class="wide" type="button" aria-expanded="'+opened+'" aria-controls="entry">Sign in <span aria-hidden="true">'+(opened?'⌃':'⌄')+'</span></button><div id="entry" '+(opened?'':'hidden')+'><form id="login" class="section stack"><label>Search by name<input id="name" autocomplete="off" placeholder="E.g. Ana"></label><p class="hint">Enter at least three letters and select your name.</p><div id="matches" class="stack" aria-live="polite"></div><div id="password-area" hidden><label>Password<input name="password" type="password" autocomplete="off"></label><p class="hint">Demo password: 1234</p><button type="submit" class="wide">Confirm sign-in <span aria-hidden="true">→</span></button></div><p id="login-error" class="error" role="alert"></p></form></div>';
  view.querySelector("#expand").onclick=()=>{opened=!opened;renderLogin();view.querySelector(opened?"#name":"#expand").focus();};
  const form=view.querySelector("#login"), name=view.querySelector("#name"), matches=view.querySelector("#matches");
  const passwordArea=view.querySelector("#password-area");
  let selected=null;
  const normalize=value=>value.trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  name.oninput=()=>{
    selected=null;passwordArea.hidden=true;form.elements.password.value="";matches.replaceChildren();
    view.querySelector("#login-error").textContent="";
    if(normalize(name.value).length<3)return;
    for(const person of people.filter(person=>normalize(person.name).startsWith(normalize(name.value)))){
      const option=document.createElement("button");
      option.type="button";option.className="secondary";option.textContent=person.name;
      option.onclick=()=>{selected=person;name.value=person.name;matches.replaceChildren();passwordArea.hidden=false;form.elements.password.focus();};
      matches.append(option);
    }
    if(!matches.children.length)matches.textContent="No employees found.";
  };
  form.onsubmit=event=>{
    event.preventDefault();
    if(!selected||form.elements.password.value!=="1234"){
      view.querySelector("#login-error").textContent="Check your name and password. If you cannot sign in, contact your fleet manager.";return;
    }
    user=selected;filters={plate:plates[0],period:monthKey};go("home");
  };
}
function renderHome(){
  view.innerHTML='<div class="hero"><h1>Hello, '+safe(user.name)+'</h1><p>Employee area</p></div><div class="stack">'+
    button('Log a trip <span aria-hidden="true">→</span>',"new-trip","wide")+
    button('View trips <span aria-hidden="true">→</span>',"search","wide secondary")+
    button('Contact the fleet manager <span aria-hidden="true">→</span>',"messages","wide secondary")+button(fuelCopy.title,"fuel","wide secondary")+'</div>';
}
function field(label,name,type,value,extra=""){
  return '<label>'+label+'<input required name="'+name+'" type="'+type+'" value="'+safe(value)+'" '+extra+'></label>';
}
function renderTrip(){
  const existing=trips.find(trip=>trip.id===activeEdit&&trip.owner===user.id);
  const trip=existing||{};
  const group=(title,kind,place,code,km)=>'<fieldset class="section"><legend>'+title+'</legend><div class="grid">'+
    field("Date",kind,"date",trip[kind]?tripDate(trip[kind]):"")+
    field("Location",place,"text",trip[place],'class="upper"')+
    countryPicker(code,trip[code])+
    field("Odometer (km)",km,"number",trip[km],'min="0" step="1" inputmode="numeric"')+'</div></fieldset>';
  view.innerHTML='<h1>'+(existing?'Edit trip':'Log a trip')+'</h1><p class="muted">All fields are required.</p><form id="trip"><label>Lorry registration<select name="plate">'+plateOptions(trip.plate)+'</select></label>'+
    group("Departure","start","from","origin","kmStart")+group("Arrival","end","to","destination","kmEnd")+
    '<p class="error" id="trip-error" role="alert"></p><div class="actions"><button type="submit">Submit</button>'+button("Back",existing?"search":"home")+'</div></form>';
  const form=view.querySelector("#trip");
  form.querySelectorAll(".country-picker").forEach(picker=>{
    const summary=picker.querySelector("summary");
    const input=picker.querySelector("input");
    const choices=picker.querySelectorAll("[data-country]");
    summary.setAttribute("aria-label",input.name==="origin"?"Departure country":"Arrival country");
    choices.forEach(choice=>choice.onclick=()=>{
      input.value=choice.dataset.country;
      picker.querySelector(".country-current").innerHTML=countryText(input.value);
      summary.setAttribute("aria-label",(input.name==="origin"?"Departure country: ":"Arrival country: ")+countries[input.value]);
      summary.removeAttribute("aria-invalid");
      choices.forEach(option=>option.setAttribute("aria-pressed",String(option===choice)));
      picker.open=false;
      summary.focus();
    });
    picker.addEventListener("keydown",event=>{
      if(event.key==="Escape"&&picker.open){picker.open=false;summary.focus();}
    });
  });
  form.onsubmit=event=>{
    event.preventDefault();
    const data=Object.fromEntries(new FormData(form));
    const recordedNow=new Date().toISOString();
    const candidate={...data,id:existing?.id||String(Date.now()),owner:user.id,
      start:existing&&tripDate(existing.start)===data.start?existing.start:data.start,
      end:existing&&tripDate(existing.end)===data.end?existing.end:data.end,
      registeredAt:existing?existing.registeredAt:recordedNow,updatedAt:existing?recordedNow:undefined,
      from:data.from.trim().toLocaleUpperCase("en-GB"),to:data.to.trim().toLocaleUpperCase("en-GB"),
      kmStart:Number(data.kmStart),kmEnd:Number(data.kmEnd)};
    form.querySelectorAll("[aria-invalid]").forEach(input=>input.removeAttribute("aria-invalid"));
    const error=validateTrip(candidate);
    if(error){
      view.querySelector("#trip-error").textContent=error[1];
      const field=form.elements[error[0]];
      const control=field.type==="hidden"?field.closest("details").querySelector("summary"):field;
      control.setAttribute("aria-invalid","true");control.focus();return;
    }
    trips=trips.filter(item=>item.id!==candidate.id).concat(candidate);
    filters={plate:candidate.plate,period:candidate.start.slice(0,7)};
    go("search",existing?"Trip updated.":"Trip saved.");
  };
}
function validateTrip(trip){
  if(!Object.hasOwn(countries,trip.origin))return ["origin","Select the departure country."];
  if(!Object.hasOwn(countries,trip.destination))return ["destination","Select the arrival country."];
  const start=tripDate(trip.start),end=tripDate(trip.end);
  if(start<"2024-01-01")return ["start","Departure must be on or after the employee’s start date (1 Jan 2024 in the demo)."];
  if(!trip.from||!trip.to)return [!trip.from?"from":"to","Enter the trip location."];
  if(end<start)return ["end","The arrival date must be on or after the departure date."];
  if(trip.kmEnd<=trip.kmStart)return ["kmEnd","The arrival odometer reading must exceed the departure reading."];
  const same=trips.filter(item=>item.plate===trip.plate&&item.id!==trip.id);
  const exact=(a,b)=>a.length>10&&b.length>10;
  const before=(a,b)=>exact(a,b)?a<b:tripDate(a)<tripDate(b);
  const completed=(a,b)=>exact(a,b)?a<=b:tripDate(a)<tripDate(b);
  if(same.some(item=>before(trip.start,item.end)&&before(item.start,trip.end)))return ["start","This lorry already has an overlapping trip. Check the dates."];
  const previous=same.filter(item=>completed(item.end,trip.start)).sort((a,b)=>b.end.localeCompare(a.end))[0];
  if(previous&&trip.kmStart<previous.kmEnd)return ["kmStart","The departure odometer reading is below this lorry’s previous arrival reading ("+num(previous.kmEnd)+" km)."];
  const next=same.filter(item=>completed(trip.end,item.start)).sort((a,b)=>a.start.localeCompare(b.start))[0];
  if(next&&trip.kmEnd>next.kmStart)return ["kmEnd","The arrival odometer reading exceeds this lorry’s next departure reading ("+num(next.kmStart)+" km)."];
  return null;
}
function selectedTrips(){
  return trips.filter(item=>item.owner===user.id&&item.plate===filters.plate&&item.start.startsWith(filters.period)).sort((a,b)=>a.start.localeCompare(b.start));
}
function renderSearch(){
  view.innerHTML='<h1>View trips</h1><p class="muted">'+safe(user.name)+'</p><div class="grid"><label>Lorry registration<select id="filter-plate">'+plateOptions(filters.plate)+'</select></label><label>Month and year<input type="month" id="period" value="'+safe(filters.period)+'"></label></div><div id="results"></div><div class="actions"><button type="button" id="print">Print (PDF)</button>'+button("Back","home")+'</div>';
  const results=view.querySelector("#results");
  function show(){
    const items=selectedTrips();
    results.innerHTML='<p class="totals">'+items.length+' '+(items.length===1?'trip':'trips')+' · '+num(items.reduce((sum,item)=>sum+distance(item),0))+' km in total</p>'+
      (items.length?items.map(item=>'<article class="section trip"><div><h3>'+safe(item.from)+' → '+safe(item.to)+'</h3><p>'+countryText(item.origin)+' · '+countryText(item.destination)+'</p><p>'+tripDateText(item.start)+' — '+tripDateText(item.end)+'</p><p>'+num(distance(item))+' km</p></div><button type="button" class="secondary small" data-edit="'+safe(item.id)+'">Edit</button></article>').join(""):'<p class="hint">No trips found.</p>');
  }
  view.querySelector("#filter-plate").onchange=event=>{filters.plate=event.target.value;show();};
  view.querySelector("#period").onchange=event=>{if(event.target.value){filters.period=event.target.value;show();}};
  view.querySelector("#print").onclick=printReport;
  show();
}
function printReport(){
  const items=selectedTrips();
  const period=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(new Date(filters.period+"-01T12:00"));
  report.innerHTML='<h1>Trip Log</h1><h2>Monthly report</h2><p>'+safe(user.name)+' · '+safe(filters.plate)+' · '+safe(period)+'</p>'+
    '<table><thead><tr><th>Departure</th><th>Start km</th><th>Arrival</th><th>End km</th><th>Distance</th></tr></thead><tbody>'+
    (items.length?items.map(item=>'<tr><td>'+tripDateText(item.start)+'<br>'+safe(item.from)+' · '+countryText(item.origin)+'</td><td>'+num(item.kmStart)+'</td><td>'+tripDateText(item.end)+'<br>'+safe(item.to)+' · '+countryText(item.destination)+'</td><td>'+num(item.kmEnd)+'</td><td>'+num(distance(item))+' km</td></tr>').join(""):'<tr><td colspan="5">No trips found.</td></tr>')+
    '</tbody></table><p>Total: '+items.length+' trips · '+num(items.reduce((sum,item)=>sum+distance(item),0))+' km</p>';
  window.print();
}

function contactStatus(item){
  if(item.state==="closed")return item.outcome==="unresolved"?contactCopy.unresolved:contactCopy.closed;
  return item.state==="analysis"?contactCopy.analysis:contactCopy.processing;
}

function contactReply(item){
  if(item.state!=="closed")return "";
  if(item.outcome==="unresolved")return contactCopy.declined;
  if(item.outcome==="resolved"&&item.effectiveAt)return contactCopy.updated+" "+dateText(item.effectiveAt)+".";
  return "";
}

function renderMessages(){
  const c=contactCopy;
  const createdAt=new Date();
  const localDate=[createdAt.getFullYear(),String(createdAt.getMonth()+1).padStart(2,"0"),
    String(createdAt.getDate()).padStart(2,"0")].join("-");
  const own=messages.filter(item=>item.owner===user.id&&("phone" in item||"email" in item));
  const details=item=>[item.phone?c.phone+": "+safe(item.phone):"",item.email?c.email+": "+safe(item.email):""]
    .filter(Boolean).join(" · ");
  view.innerHTML='<h1>'+c.title+'</h1><p>'+c.prompt+'</p><dl class="section"><dt>'+c.employee+'</dt><dd>'+
    safe(user.name)+'</dd><dt>'+c.date+'</dt><dd>'+tripDateText(localDate)+'</dd></dl>'+
    '<form id="message" class="stack"><label>'+c.phone+'<input type="tel" name="phone" autocomplete="tel"></label>'+
    '<label>'+c.email+'<input type="email" name="email" autocomplete="email"></label>'+
    '<p id="message-error" class="error" role="alert"></p><div class="actions"><button type="submit">'+c.send+'</button>'+
    button(c.back,"home")+'</div></form><section class="section"><h2>'+c.history+'</h2>'+
    (own.length?own.map(item=>{
      const reply=contactReply(item);
      return '<article class="section"><h3>'+safe(contactStatus(item))+'</h3><p class="hint">'+
        tripDateText(item.date)+'</p><p>'+details(item)+'</p>'+
        (reply?'<p><strong>'+c.reply+'</strong><br>'+safe(reply)+'</p>':'')+'</article>';
    }).join(""):'<p class="hint">'+c.empty+'</p>')+'</section>';
  view.querySelector("#message").onsubmit=event=>{
    event.preventDefault();
    const data=new FormData(event.currentTarget);
    const phone=data.get("phone").trim(),email=data.get("email").trim();
    if(!phone&&!email){view.querySelector("#message-error").textContent=c.missing;return;}
    messages.unshift({owner:user.id,date:localDate,createdAt:createdAt.toISOString(),phone,email,state:"sent"});
    go("messages",c.sent);
  };
}

view.addEventListener("click",event=>{
  const control=event.target.closest("button");if(!control)return;
  if(control.dataset.edit){activeEdit=control.dataset.edit;go("trip");return;}
  if(control.dataset.go==="new-trip"){activeEdit=null;go("trip");return;}
  if(control.dataset.go)go(control.dataset.go);
});
headerAction.onclick=()=>{
  if(user){user=null;opened=false;go("login","Signed out.");return;}
  statusBox.textContent="The fleet manager and administrator areas will be shown in a later release.";
};
const fuelCopy={"title": "Fuel", "entry": "Log a refuelling", "history": "Monthly history", "plate": "Lorry registration", "date": "Date", "odometer": "Odometer (km)", "selectPlate": "Select registration", "type": "Fuel type", "diesel": "Diesel", "petrol": "Petrol", "litres": "Litres", "save": "Save refuelling", "period": "Month and year", "saved": "Refuelling saved.", "empty": "No refuelling entries found.", "total": "Monthly total", "back": "Back", "invalid": "Enter a volume greater than zero and a valid odometer reading.", "adblue": "AdBlue", "selectType": "Select fuel type", "missing": "Complete the required fields.", "totalFuel": "Total fuel", "distance": "Distance in period", "average": "Estimated average consumption", "insufficient": "Insufficient data", "basis": "Based on fuel added and distance travelled during the selected period."};

const exampleFuel=[
  {owner:"ana",plate:plates[0],date:sampleDay(4),type:"diesel",volumeMl:64250,odometer:15135},
  {owner:"ana",plate:plates[0],date:sampleDay(6),type:"adblue",volumeMl:31750,odometer:15450},
  {owner:"joao",plate:plates[0],date:sampleDay(5),type:"diesel",volumeMl:80000,odometer:15350}
];
const fuelRecords=typeof saved!=="undefined"&&Array.isArray(saved.fuelRecords)?saved.fuelRecords:exampleFuel.slice();
let fuelFilters=typeof saved!=="undefined"&&saved.fuelFilters?saved.fuelFilters:{plate:plates[0],period:monthKey};
const fuelTypes=["diesel","adblue","petrol"];
const fuelTypeOptions='<option value="">'+fuelCopy.selectType+'</option>'+fuelTypes
  .map(type=>'<option value="'+type+'">'+safe(fuelCopy[type])+'</option>').join("");
const litresText=ml=>new Intl.NumberFormat(document.documentElement.lang,{maximumFractionDigits:3}).format(ml/1000)+" L";

function fuelForMonth(records,owner,plate,period){
  return records.filter(item=>item.owner===owner&&item.plate===plate&&item.date.slice(0,7)===period)
    .sort((a,b)=>a.date.localeCompare(b.date));
}

function fuelSummary(records,journeys,owner,plate,period){
  const entries=fuelForMonth(records,owner,plate,period);
  const fuelMl=entries.filter(item=>item.type==="diesel"||item.type==="petrol")
    .reduce((sum,item)=>sum+item.volumeMl,0);
  const kilometres=journeys.filter(trip=>trip.owner===owner&&trip.plate===plate&&trip.start.slice(0,7)===period)
    .reduce((sum,trip)=>sum+distance(trip),0);
  const average=fuelMl>0&&kilometres>0?(fuelMl/1000)/kilometres*100:null;
  return {entries,fuelMl,kilometres,average};
}

function renderFuel(){
  const c=fuelCopy;
  view.innerHTML='<h1>'+c.title+'</h1><p class="muted">'+safe(user.name)+'</p>'+
    '<section class="section"><h2>'+c.entry+'</h2><label>'+c.plate+
    '<select id="fuel-entry-plate"><option value="">'+c.selectPlate+'</option>'+plateOptions()+'</select></label>'+
    '<form id="fuel-entry" hidden><div class="grid">'+
    field(c.date,"date","date","")+
    '<label>'+c.type+'<select name="type" required>'+fuelTypeOptions+'</select></label>'+
    field(c.litres,"litres","number","",'min="0.001" step="0.001" inputmode="decimal"')+
    field(c.odometer,"odometer","number","",'min="0" step="1" inputmode="numeric"')+
    '</div><p id="fuel-error" class="error" role="alert"></p><div class="actions"><button type="submit">'+c.save+'</button></div></form></section>'+
    '<section class="section"><h2>'+c.history+'</h2><div class="grid"><label>'+c.plate+
    '<select id="fuel-plate">'+plateOptions(fuelFilters.plate)+'</select></label><label>'+c.period+
    '<input type="month" id="fuel-period" required value="'+safe(fuelFilters.period)+'"></label></div>'+
    '<div id="fuel-list" aria-live="polite"></div></section><div class="actions">'+button(c.back,"home")+'</div>';
  const form=view.querySelector("#fuel-entry");
  const plate=view.querySelector("#fuel-plate"), period=view.querySelector("#fuel-period");
  const list=view.querySelector("#fuel-list"), error=view.querySelector("#fuel-error");
  const entryPlate=view.querySelector("#fuel-entry-plate");
  const remember=()=>{if(typeof saveState==="function")saveState();};
  function showFuel(){
    const {entries:records,fuelMl,kilometres,average}=fuelSummary(
      fuelRecords,trips,user.id,fuelFilters.plate,fuelFilters.period);
    const totals=fuelTypes.map(type=>({type,total:records.filter(item=>item.type===type).reduce((sum,item)=>sum+item.volumeMl,0)}));
    list.innerHTML='<div class="totals"><div>'+c.totalFuel+' · '+litresText(fuelMl)+'</div><div>'+
      c.distance+' · '+num(kilometres)+' km</div><div>'+c.average+' · '+
      (average===null?c.insufficient:num(average)+' L/100 km')+'</div></div>'+
      '<p class="hint">'+c.basis+'</p><p class="hint">'+c.total+' · '+
      (totals.filter(item=>item.total).map(item=>c[item.type]+': '+litresText(item.total)).join(' · ')||'0 L')+'</p>'+
      (records.length?records.map(item=>'<article class="section trip"><div><h3>'+safe(c[item.type])+'</h3><p>'+
        tripDateText(item.date)+' · '+num(item.odometer)+' km</p></div><strong>'+
        litresText(item.volumeMl)+'</strong></article>').join(""):'<p class="hint">'+c.empty+'</p>');
  }
  entryPlate.onchange=()=>{form.reset();error.textContent="";form.hidden=!entryPlate.value;};
  plate.onchange=()=>{fuelFilters.plate=plate.value;remember();showFuel();};
  period.onchange=()=>{if(period.value){fuelFilters.period=period.value;remember();showFuel();}};
  form.onsubmit=event=>{
    event.preventDefault();
    const data=Object.fromEntries(new FormData(form));
    const volumeMl=Math.round(Number(data.litres)*1000);
    const odometer=Number(data.odometer);
    if(!plates.includes(entryPlate.value)||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(data.date)||
       !fuelTypes.includes(data.type)||data.odometer===""){error.textContent=c.missing;return;}
    if(!Number.isSafeInteger(volumeMl)||volumeMl<=0||!Number.isSafeInteger(odometer)||odometer<0){error.textContent=c.invalid;return;}
    fuelRecords.push({owner:user.id,plate:entryPlate.value,date:data.date,registeredAt:new Date().toISOString(),type:data.type,volumeMl,odometer});
    fuelFilters={plate:entryPlate.value,period:data.date.slice(0,7)};
    form.reset();error.textContent="";
    plate.value=fuelFilters.plate;period.value=fuelFilters.period;
    statusBox.textContent=c.saved;remember();showFuel();
  };
  showFuel();
}

document.querySelectorAll("[data-language-flag]").forEach(link=>{
  const icon=document.createElementNS("http://www.w3.org/2000/svg","svg");
  icon.setAttribute("class","flag");
  icon.setAttribute("viewBox","0 0 36 24");
  icon.setAttribute("aria-hidden","true");
  icon.innerHTML=flags[link.dataset.languageFlag];
  link.replaceChildren(icon);
});
go("login");
