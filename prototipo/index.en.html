<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viagens — Fleet management</title>
<style>
:root{--navy:#122c40;--green:#176b50;--mint:#eaf5ef;--orange:#f17c25;--paper:#f5f7f9;--line:#dfe7eb;--muted:#647786}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--navy);background:var(--paper)}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.brand{background:white;text-align:center;padding:22px;border-bottom:1px solid var(--line)}.brand img{width:210px;max-height:100px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:12px}.badge{display:inline-block;color:#95500b;background:#fff1df;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.06em}.wrap{max-width:1120px;margin:auto;padding:32px 24px 60px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.toolbar a{color:var(--green);text-decoration:none;font-weight:600}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:750}h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.04em;margin:5px 0 8px}h2{font-size:19px;margin:0 0 16px}p{color:var(--muted)}.intro{text-align:center;margin:24px 0 32px}.intro p{margin:6px auto;max-width:620px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 5px 20px #122c4005}.access{text-align:left;position:relative;padding:32px;width:100%;color:inherit;transition:transform .2s,border-color .2s}.access:hover{transform:translateY(-3px);border-color:var(--green)}.access .icon{font-size:28px;background:var(--mint);width:58px;height:58px;border-radius:16px;display:grid;place-items:center;margin-bottom:24px}.access strong{font-size:23px;display:block}.access p{min-height:48px}.access span.link{color:var(--green);font-weight:700}.notice{font-size:12px;color:var(--muted);margin:22px 0}.btn{border:1px solid var(--line);background:white;border-radius:10px;color:var(--navy);padding:11px 17px;font-weight:650}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.orange{background:var(--orange);border-color:var(--orange);color:#1b2632}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat small{display:block;color:var(--muted)}.stat strong{display:block;font-size:30px;margin:8px 0}.stat .change{font-size:12px;color:var(--green)}.period{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input,select{padding:11px 12px;border:1px solid #becbd3;border-radius:9px;background:white;min-width:0;width:100%;color:var(--navy)}input:focus,select:focus{outline:2px solid #176b5040;border-color:var(--green)}.period input{width:auto}label{font-size:13px;font-weight:650;display:grid;gap:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field-group{border:0;padding:0;margin:24px 0}legend{font-size:17px;font-weight:700;margin-bottom:15px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}th,td{padding:13px 10px;border-bottom:1px solid var(--line)}.chart{width:100%;height:auto;max-height:260px}.chart text{font:12px system-ui;fill:var(--muted)}.legend{display:flex;gap:20px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px}.dot.orange{background:var(--orange)}.country{display:flex;align-items:center;gap:8px}.country .flag{font-size:24px}.empty{padding:25px;color:var(--muted);text-align:center}.report{margin-top:24px}.signature{margin-top:26px;padding:20px;border:1px dashed #9cafa5;border-radius:12px}.signed{font-family:Georgia,serif;font-style:italic;font-size:24px;color:var(--green)}.error{color:#b53324;font-size:13px}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;border-top:1px solid var(--line)}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:13px 22px;border-radius:12px;max-width:90%;z-index:9}#toast:empty{display:none}[hidden]{display:none!important}@media(max-width:700px){.grid,.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.wrap{padding:24px 16px}.toolbar{align-items:flex-start;flex-direction:column}.card{padding:20px}.access p{min-height:0}}@media print{body{background:white}.brand,.toolbar,.intro,.no-print,footer,#toast{display:none!important}.wrap{padding:0;max-width:none}.card{box-shadow:none;border:0;padding:0}.report{margin:0}th,td{white-space:normal}.signature{break-inside:avoid}.print-title{display:block!important} @page{size:A4;margin:16mm}}
</style></head><body><header class="brand"><img src="../assets/Logo_Viagens.png" alt="Journeys"><small>Fleet journey and expense management</small><nav class="no-print" aria-label="Language" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:16px;font-size:13px"><a href="index.html" lang="pt" style="color:var(--green)">Português</a><a href="index.en.html" lang="en" style="color:var(--green)">English</a><a href="index.es.html" lang="es" style="color:var(--green)">Español</a></nav><div class="no-print" style="margin-top:12px;font-size:12px"><a href="pdf/Prototipo_Gestor_EN.pdf">Manager PDF</a> · <a href="pdf/Prototipo_Condutor_EN.pdf">Driver PDF</a></div></header><main class="wrap" id="app"></main><footer>Viagens · Experience prototype · Fictional data · No authentication or database</footer><div id="toast" role="status" aria-live="polite"></div>
<script>
const app=document.getElementById('app');
const drivers=[{id:'joao',name:'João Silva',truck:'34-AB-56'},{id:'ana',name:'Ana Martins',truck:'78-CD-90'},{id:'pedro',name:'Pedro Lopes',truck:'12-EF-34'}];
const countries={PT:'🇵🇹 Portugal',ES:'🇪🇸 Spain',FR:'🇫🇷 France'};
const currentMonth=new Date().toISOString().slice(0,7);const prevDate=new Date();prevDate.setMonth(prevDate.getMonth()-1);const previousMonth=prevDate.toISOString().slice(0,7);
let trips=[{driver:'joao',start:currentMonth+'-03T08:00',end:currentMonth+'-03T17:00',origin:'Tui',from:'ES',destination:'Madrid',to:'ES',initial:82410,final:82999},{driver:'joao',start:currentMonth+'-08T07:30',end:currentMonth+'-08T16:00',origin:'Madrid',from:'ES',destination:'Porto',to:'PT',initial:82999,final:83500},{driver:'ana',start:currentMonth+'-05T09:00',end:currentMonth+'-05T13:00',origin:'Vigo',from:'ES',destination:'Porto',to:'PT',initial:41000,final:41172},{driver:'pedro',start:currentMonth+'-10T08:00',end:currentMonth+'-10T13:00',origin:'Lisboa',from:'PT',destination:'Faro',to:'PT',initial:62000,final:62278},{driver:'joao',start:previousMonth+'-03T08:00',end:previousMonth+'-03T16:00',origin:'Tui',from:'ES',destination:'Madrid',to:'ES',initial:81000,final:81580},{driver:'ana',start:previousMonth+'-05T08:00',end:previousMonth+'-05T13:00',origin:'Vigo',from:'ES',destination:'Porto',to:'PT',initial:40000,final:40170}];
const consumptions=[
{driver:'joao',date:currentMonth+'-03',type:'Fuel',place:'Tui',country:'ES',litres:180,amount:279},
{driver:'joao',date:currentMonth+'-08',type:'Fuel',place:'Madrid',country:'ES',litres:150,amount:240},
{driver:'joao',date:currentMonth+'-08',type:'Parking',place:'Porto',country:'PT',litres:0,amount:24},
{driver:'ana',date:currentMonth+'-05',type:'Fuel',place:'Vigo',country:'ES',litres:52,amount:80.60},
{driver:'ana',date:currentMonth+'-05',type:'Parking',place:'Porto',country:'PT',litres:0,amount:12},
{driver:'pedro',date:currentMonth+'-10',type:'Fuel',place:'Lisboa',country:'PT',litres:83,amount:132.80},
{driver:'joao',date:previousMonth+'-03',type:'Fuel',place:'Tui',country:'ES',litres:175,amount:271.25},
{driver:'ana',date:previousMonth+'-05',type:'Fuel',place:'Vigo',country:'ES',litres:50,amount:77.50}
];
let role='',driverId='joao',month=currentMonth,signature=null;
const selectedConsumptions=(m=month,id=null)=>consumptions.filter(c=>c.date.slice(0,7)===m&&(!id||c.driver===id));
const money=n=>n.toLocaleString('en-GB',{style:'currency',currency:'EUR'});
const sumField=(a,key)=>a.reduce((n,c)=>n+c[key],0);
function consumptionRows(a){return a.map(c=>{const person=drivers.find(x=>x.id===c.driver);return `<tr><td>${new Date(c.date+'T12:00').toLocaleDateString('en-GB')}</td><td>${esc(person.name)}<br>${person.truck}</td><td>${c.type}</td><td>${esc(c.place)} ${countries[c.country].split(' ')[0]}</td><td>${c.type==='Fuel'?num(c.litres)+' L':'—'}</td><td>${money(c.amount)}</td></tr>`}).join('')}
function consumptionTable(a){return `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Driver / truck</th><th>Type</th><th>Location / country</th><th>Quantity</th><th>Amount</th></tr></thead><tbody>${consumptionRows(a)}</tbody></table></div>${!a.length?'<p class="empty">No consumption records for this period.</p>':''}<p><strong>Fuel: ${num(sumField(a,'litres'))} L · Total: ${money(sumField(a,'amount'))}</strong></p>`}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n.toLocaleString('en-GB');const km=t=>t.final-t.initial;
const selected=(m=month,id=null)=>trips.filter(t=>t.start.slice(0,7)===m&&(!id||t.driver===id));
const total=a=>a.reduce((v,t)=>v+km(t),0);
const d=()=>drivers.find(x=>x.id===driverId);
function previous(m){let [y,mo]=m.split('-').map(Number);return new Date(Date.UTC(y,mo-2,1)).toISOString().slice(0,7)}
function percent(now,before){return before?((now-before)/before*100).toLocaleString('en-GB',{minimumFractionDigits:1,maximumFractionDigits:1})+'%': 'No previous baseline'}
function labelMonth(m){return new Date(m+'-02T12:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function date(s){return new Date(s).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'})}
function toast(s){document.getElementById('toast').textContent=s;setTimeout(()=>document.getElementById('toast').textContent='',3800)}
function pageHeader(title,sub){return `<div class="toolbar no-print"><a href="#" data-go="home">← Choose access</a><span class="badge">DEMONSTRATION · ${role==='manager'?'MANAGER':esc(d().name)}</span></div><div class="no-print"><div class="eyebrow">${role==='manager'?'Fleet overview':'Individual driver area'}</div><h1>${title}</h1><p>${sub}</p></div>`}
function options(){return Object.entries(countries).map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}
function home(){role='';app.innerHTML=`<div class="intro"><span class="badge">INTERACTIVE PROTOTYPE</span><h1>Every journey, a clearer view.</h1><p>Choose your access to monitor the fleet or manage your own journey records.</p></div><div class="grid"><button class="card access" data-access="manager"><span class="icon" aria-hidden="true">▥</span><strong>Manager access</strong><p>Monthly indicators, trucks, kilometres, consumption and drivers.</p><span class="link">Monitor the fleet →</span></button><button class="card access" data-access="driver"><span class="icon" aria-hidden="true">↗</span><strong>Individual driver access</strong><p>Your routes, journeys and reports in one place.</p><span class="link">Open individual area →</span></button></div><p class="notice" style="text-align:center">Access options simulate user roles. This prototype does not validate logins.</p>`;bind()}
function chart(id){const now=selected(month,id),old=selected(previous(month),id);const values=id?[total(old),total(now)]:drivers.flatMap(x=>[total(old.filter(t=>t.driver===x.id)),total(now.filter(t=>t.driver===x.id))]);const max=Math.max(...values,1);let bars='';if(id){[total(old),total(now)].forEach((v,i)=>{let h=v/max*150;bars+=`<rect x="${150+i*230}" y="${185-h}" width="100" height="${h}" rx="5" fill="${i?'#176b50':'#f17c25'}"/><text x="${200+i*230}" y="${175-h}" text-anchor="middle">${num(v)} km</text><text x="${200+i*230}" y="213" text-anchor="middle">${i?'Selected month':'Previous month'}</text>`})}else{drivers.forEach((x,i)=>{[total(old.filter(t=>t.driver===x.id)),total(now.filter(t=>t.driver===x.id))].forEach((v,j)=>{let h=v/max*145;bars+=`<rect x="${72+i*215+j*57}" y="${185-h}" width="45" height="${h}" rx="4" fill="${j?'#176b50':'#f17c25'}"/><text x="${94+i*215+j*57}" y="${175-h}" text-anchor="middle">${num(v)}</text>`});bars+=`<text x="${123+i*215}" y="215" text-anchor="middle">${x.name}</text>`})}return `<svg class="chart" viewBox="0 0 700 235" role="img" aria-label="Kilometre comparison with the previous month"><line x1="35" y1="186" x2="675" y2="186" stroke="#dfe7eb"/>${bars}</svg><div class="legend"><span><i class="dot orange"></i>Previous month</span><span><i class="dot"></i>Selected month</span></div>`}
function dashboard(){let id=role==='driver'?driverId:null,a=selected(month,id),b=selected(previous(month),id),active=new Set(a.map(t=>t.driver)).size;app.innerHTML=pageHeader(role==='manager'?'Your fleet, in perspective.':'Hello, '+esc(d().name)+'.',role==='manager'?'Monitor monthly activity and changes from the previous month.':'Review your performance and keep your journeys up to date.')+`<div class="period no-print"><label for="month">Monthly period</label><input type="month" id="month" value="${month}" required><button class="btn" id="updateMonth">Update</button>${role==='driver'?`<label for="driverSelect">Demonstration driver</label><select id="driverSelect" style="width:auto">${drivers.map(x=>`<option value="${x.id}" ${x.id===driverId?'selected':''}>${x.name}</option>`).join('')}</select>`:''}</div><div class="stats"><div class="card stat"><small>${id?'Assigned truck':'Total fleet trucks'}</small><strong>${id?d().truck:drivers.length}</strong><span class="change">${id?'Demonstration vehicle':active+' with journeys this month · '+percent(active,new Set(b.map(t=>t.driver)).size)+' activity change'}</span></div><div class="card stat"><small>Kilometres this month</small><strong>${num(total(a))} <small style="display:inline;font-size:15px">km</small></strong><span class="change">${percent(total(a),total(b))} compared with the previous month</span></div><div class="card stat"><small>Recorded journeys</small><strong>${a.length}</strong><span class="change">${labelMonth(month)}</span></div></div><section class="card"><h2>${id?'Your personal chart':'Kilometres by driver and truck'}</h2>${chart(id)}<p class="notice">Percentage change = (selected month − previous month) ÷ previous month × 100. Activity counts trucks with recorded journeys.</p></section><div class="actions no-print">${role==='manager'?'<button class="btn primary" data-go="consumption">Consumption</button>':'<button class="btn primary" data-go="new">＋ Add journey</button><button class="btn" data-go="consumption">Consumption</button>'}<button class="btn" data-go="query">⌕ View records</button></div>${role==='manager'?`<section class="card"><h2>Driver list</h2><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Truck</th><th>Journeys</th><th>Km in period</th></tr></thead><tbody>${drivers.map(x=>`<tr><td>${x.name}</td><td>${x.truck}</td><td>${selected(month,x.id).length}</td><td>${num(total(selected(month,x.id)))}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;bind();document.getElementById('updateMonth').onclick=()=>{let v=document.getElementById('month').value;if(v){month=v;signature=null;dashboard()}};if(id)document.getElementById('driverSelect').onchange=e=>{driverId=e.target.value;signature=null;dashboard()}}
function newTrip(){app.innerHTML=pageHeader('Add journey','Record departure and arrival. All fields are required.')+`<button class="btn no-print" data-go="dashboard">← Back to dashboard</button><form class="card" id="tripForm" style="margin-top:22px"><p><strong>${esc(d().name)}</strong> · Truck ${d().truck}</p><fieldset class="field-group"><legend>01 · Departure</legend><div class="fields"><label>Start date and time<input type="datetime-local" name="start" required></label><label>Departure location<input name="origin" placeholder="E.g. Tui" maxlength="100" required></label><label>Departure country<div class="country"><span class="flag" id="flagFrom" aria-hidden="true">🇵🇹</span><select name="from" id="from">${options()}</select></div></label><label>Initial odometer reading<input name="initial" type="number" min="0" step="1" required></label></div></fieldset><fieldset class="field-group"><legend>02 · Arrival</legend><div class="fields"><label>End date and time<input type="datetime-local" name="end" required></label><label>Arrival location<input name="destination" placeholder="E.g. Madrid" maxlength="100" required></label><label>Arrival country<div class="country"><span class="flag" id="flagTo" aria-hidden="true">🇵🇹</span><select name="to" id="to">${options()}</select></div></label><label>Final odometer reading<input name="final" type="number" min="0" step="1" required></label></div></fieldset><p id="formError" class="error" role="alert"></p><button class="btn primary" type="submit">Register journey</button><p class="notice">The entry is kept only for this demonstration session and is not sent to a server.</p></form>`;bind();['from','to'].forEach(n=>document.getElementById(n).onchange=e=>document.getElementById(n==='from'?'flagFrom':'flagTo').textContent=countries[e.target.value].split(' ')[0]);document.getElementById('tripForm').onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));data.initial=Number(data.initial);data.final=Number(data.final);let msg='';if(!data.origin.trim()||!data.destination.trim())msg='Enter the departure and arrival locations.';else if(data.end<data.start)msg='Arrival cannot be earlier than departure.';else if(data.final<data.initial)msg='The final odometer reading cannot be lower than the initial reading.';if(msg){document.getElementById('formError').textContent=msg;return}trips.push({...data,origin:data.origin.trim(),destination:data.destination.trim(),driver:driverId});month=data.start.slice(0,7);signature=null;dashboard();toast('Journey registered for this demonstration session.')}}
function consumption(){
const id=role==='driver'?driverId:null,a=selectedConsumptions(month,id),old=selectedConsumptions(previous(month),id);
app.innerHTML=pageHeader(role==='driver'?'Your consumption':'Fleet consumption','Review fuel and parking expenses for the monthly period.')+`<button class="btn no-print" data-go="dashboard">← Back to dashboard</button><section class="card no-print" style="margin-top:22px"><form id="consumptionPeriod" class="period"><label>Month and year<input type="month" id="consumptionMonth" value="${month}" required></label><button class="btn" type="submit">Update</button></form></section><div class="stats"><div class="card stat"><small>Total expense</small><strong>${money(sumField(a,'amount'))}</strong><span class="change">${percent(sumField(a,'amount'),sumField(old,'amount'))} compared with the previous month</span></div><div class="card stat"><small>Fuel</small><strong>${num(sumField(a,'litres'))} L</strong><span class="change">${money(sumField(a.filter(c=>c.type==='Fuel'),'amount'))}</span></div><div class="card stat"><small>Parking</small><strong>${money(sumField(a.filter(c=>c.type==='Parking'),'amount'))}</strong><span class="change">${a.filter(c=>c.type==='Parking').length} record(s)</span></div></div><section class="card"><h2>${labelMonth(month)}${id?' · '+esc(d().name):' · All drivers'}</h2>${consumptionTable(a)}<p class="notice">Fictional data. Consumption records are demonstration entries, independent of journeys added during this session.</p></section><div class="actions no-print"><button class="btn primary" data-go="queryConsumption">View / generate consumption report</button><button class="btn" data-go="queryCombined">Combined report with journeys</button></div>`;
bind();document.getElementById('consumptionPeriod').onsubmit=e=>{e.preventDefault();month=document.getElementById('consumptionMonth').value;consumption()};
}
function query(initialType='trips'){
signature=null;
app.innerHTML=pageHeader('View journeys and consumption','Choose the period and report contents, separate or combined.')+`<button class="btn no-print" data-go="dashboard">← Back to dashboard</button><section class="card no-print" style="margin-top:22px"><form id="searchForm" class="period"><span aria-hidden="true" style="font-size:30px">⌕</span><label for="searchMonth">Month and year<input id="searchMonth" type="month" value="${month}" required></label><label for="reportType">Report contents<select id="reportType"><option value="trips">Journeys</option><option value="consumptions">Consumption</option><option value="combined">Journeys and consumption</option></select></label>${role==='manager'?`<label>Driver<select id="queryDriver"><option value="">All drivers</option>${drivers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select></label>`:''}<button type="submit" class="btn primary">View records</button></form></section><div id="report"></div>`;
document.getElementById('reportType').value=initialType;bind();document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();month=document.getElementById('searchMonth').value;signature=null;report()};report();
}
function report(){
const id=role==='driver'?driverId:document.getElementById('queryDriver').value,type=document.getElementById('reportType').value;
const a=selected(month,id),c=selectedConsumptions(month,id),name=id?drivers.find(x=>x.id===id).name:'All drivers';
const includeTrips=type!=='consumptions',includeConsumptions=type!=='trips',hasDate=(includeTrips&&a.length)||(includeConsumptions&&c.length);
const title={trips:'Monthly journey report',consumptions:'Monthly consumption report',combined:'Monthly journey and consumption report'}[type];
const tripSection=includeTrips?`<section style="margin-top:26px"><h2>Journeys</h2><p>${a.length} journey(s) · <strong>${num(total(a))} km</strong></p><div class="table-wrap"><table><thead><tr><th>Driver / truck</th><th>Departure</th><th>Arrival</th><th>Initial km</th><th>Final km</th><th>Distance</th></tr></thead><tbody>${a.map(t=>`<tr><td>${esc(drivers.find(x=>x.id===t.driver).name)}<br>${drivers.find(x=>x.id===t.driver).truck}</td><td>${esc(t.origin)} ${countries[t.from].split(' ')[0]}<br>${date(t.start)}</td><td>${esc(t.destination)} ${countries[t.to].split(' ')[0]}<br>${date(t.end)}</td><td>${num(t.initial)}</td><td>${num(t.final)}</td><td>${num(km(t))} km</td></tr>`).join('')}</tbody></table></div>${!a.length?'<p class="empty">No journeys for this period.</p>':''}</section>`:'';
const consumptionSection=includeConsumptions?`<section style="margin-top:26px"><h2>Consumption — fuel and parking</h2>${consumptionTable(c)}</section>`:'';
document.getElementById('report').innerHTML=`<section class="card report"><div class="eyebrow">Folha de Viagem · ${title}</div><h1>${labelMonth(month)}</h1><p>${esc(name)}</p>${tripSection}${consumptionSection}<div class="signature"><h2>Report signature</h2><div id="signatureView"><p>Unsigned.</p></div><div class="no-print"><p class="notice">Digital signature simulation: name and date only, without a cryptographic certificate or qualified signature validity.</p><form id="signatureForm"><label>Signatory name<input id="signer" maxlength="100" value="${role==='driver'?esc(d().name):''}" required placeholder="Full name"></label><label style="display:flex;align-items:center;margin:12px 0"><input id="agree" type="checkbox" required style="width:auto">I confirm that I have reviewed this demonstration report.</label><button class="btn" type="submit" ${!hasDate?'disabled':''}>Sign report — simulation</button></form></div></div><p class="notice">Demonstration document · Fictional data · Simulated signature, without digital certification.</p></section><div class="actions no-print"><button class="btn primary" id="pdf" ${!hasDate?'disabled':''}>Generate PDF report</button><p class="notice">In the print dialog, choose “Save as PDF”. The document includes only the results displayed above.</p></div>`;
document.getElementById('signatureForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('signer').value.trim();if(!name)return;signature={name,time:new Date().toLocaleString('en-GB')};document.getElementById('signatureView').innerHTML=`<div class="signed">${esc(name)}</div><p>Signed on ${signature.time} · SIMULATION</p>`;toast('Simulated signature added to the report.')};
document.getElementById('pdf').onclick=()=>{document.title='Journeys - '+title+' - '+month;window.print()};
}
function bind(){app.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();({home,dashboard,new:newTrip,query:()=>query(),consumption,queryConsumption:()=>query('consumptions'),queryCombined:()=>query('combined')})[b.dataset.go]();window.scrollTo(0,0)});app.querySelectorAll('[data-access]').forEach(b=>b.onclick=()=>{role=b.dataset.access;dashboard();window.scrollTo(0,0)})}
home();
</script></body></html>
